[project]
name = "mnemos-memory"
version = "0.1.0"
description = "MNEMOS memory core — CockroachDB schema, vector recall, dedup, audit"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2", "boto3>=1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mnemos_memory*"]
