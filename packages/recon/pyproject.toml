[project]
name = "mnemos-recon"
version = "0.1.0"
description = "MNEMOS recon — deterministic scanner, Bedrock analyst, recon cycle"
requires-python = ">=3.11"
dependencies = ["mnemos-memory", "boto3>=1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mnemos_recon*"]
